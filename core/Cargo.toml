[package]
name = "vimvibe-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
nucleo-matcher = "0.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std", "signal"] }
toml = "1.1.8"
zbus = "5.19.0"
