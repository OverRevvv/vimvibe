<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vimvibe — click anything by typing its name</title>
<meta name="description" content="vimvibe: a keyboard-driven click-anything overlay for Linux (KDE Plasma, Wayland). Documentation.">
<link rel="icon" href="docs/icon.png">
<!--
  Documentation site for GitHub Pages (Settings → Pages → deploy from the branch root).
  No build step: this page fetches the Markdown files in the repository (README.md, docs/*.md, CONTRIBUTING.md) and
  renders them, so the website and the repository docs are always the same text. Serve it over HTTP (GitHub Pages,
  or `python3 -m http.server` in this folder): browsers block fetch() from file://.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d8dee4; --side: #f6f8fa;
    --accent: #2563eb; --accent-fg: #ffffff; --code: #eff1f3; --pre: #f6f8fa; --kbd: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --side: #010409;
      --accent: #58a6ff; --accent-fg: #0d1117; --code: #1b2129; --pre: #161b22; --kbd: #161b22;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --line: #30363d; --side: #010409;
    --accent: #58a6ff; --accent-fg: #0d1117; --code: #1b2129; --pre: #161b22; --kbd: #161b22;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px;
           background: var(--bg); border-bottom: 1px solid var(--line); }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--fg); }
  header .brand img { width: 28px; height: 28px; }
  header .spacer { flex: 1; }
  #search { width: min(320px, 40vw); padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 14px; }
  button.icon { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 14px; }
  #menu { display: none; }

  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) 210px; max-width: 1300px; margin: 0 auto; }
  nav#pages { position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow: auto; padding: 24px 16px; background: var(--bg); border-right: 1px solid var(--line); }
  nav#pages h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  nav#pages a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--fg); font-size: 15px; }
  nav#pages a:hover { background: var(--side); text-decoration: none; }
  nav#pages a.on { background: var(--side); color: var(--accent); font-weight: 600; }
  main { padding: 32px 40px 96px; min-width: 0; }
  aside#toc { position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow: auto; padding: 32px 12px; font-size: 13px; }
  aside#toc a { display: block; padding: 3px 0 3px 10px; color: var(--muted); border-left: 2px solid var(--line); }
  aside#toc a.h3 { padding-left: 22px; }
  aside#toc a.on { color: var(--accent); border-left-color: var(--accent); }

  main h1 { font-size: 2.1rem; line-height: 1.25; margin: 0 0 .6em; }
  main h2 { margin: 2.2em 0 .6em; padding-bottom: .3em; border-bottom: 1px solid var(--line); font-size: 1.5rem; }
  main h3 { margin: 1.8em 0 .5em; font-size: 1.2rem; }
  main img { max-width: 100%; height: auto; border-radius: 8px; }
  main img[align="right"] { float: right; margin: 0 0 12px 16px; border-radius: 0; }
  main blockquote { margin: 1em 0; padding: .1em 1em; border-left: 4px solid var(--accent); background: var(--side); color: var(--muted); border-radius: 0 8px 8px 0; }
  code { background: var(--code); padding: .15em .4em; border-radius: 5px; font: 0.88em ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  pre { position: relative; background: var(--pre); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow: auto; line-height: 1.5; }
  pre code { background: none; padding: 0; font-size: 13.5px; }
  pre button.copy { position: absolute; top: 8px; right: 8px; opacity: 0; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 12px; cursor: pointer; }
  pre:hover button.copy { opacity: 1; }
  .tablewrap { overflow-x: auto; margin: 1em 0; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  th, td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; vertical-align: top; }
  th { background: var(--side); }
  main strong > code, main td strong, main li strong { font-weight: 650; }
  .anchor { margin-left: .4em; opacity: 0; font-weight: 400; }
  h2:hover .anchor, h3:hover .anchor { opacity: .6; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; }
  .pager a { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; color: var(--fg); }
  .pager a small { display: block; color: var(--muted); }
  .pager a.next { text-align: right; }
  mark { background: #fde68a; color: #000; border-radius: 3px; }
  #results { margin-top: 12px; }
  #results .hit { padding: 12px 0; border-bottom: 1px solid var(--line); }
  #results .hit small { color: var(--muted); }

  @media (max-width: 1100px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } aside#toc { display: none; } }
  @media (max-width: 760px) {
    .layout { display: block; }
    #menu { display: inline-block; }
    nav#pages { position: fixed; top: 56px; left: 0; bottom: 0; width: 270px; z-index: 9; transform: translateX(-100%); transition: transform .15s; height: auto; }
    nav#pages.open { transform: none; box-shadow: 4px 0 24px rgba(0,0,0,.25); }
    main { padding: 20px 16px 72px; }
  }
</style>
</head>
<body>
<header>
  <button class="icon" id="menu" aria-label="Menu">☰</button>
  <a class="brand" href="#/overview"><img src="docs/icon.png" alt=""> vimvibe</a>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="Search the docs…" aria-label="Search the docs">
  <a class="icon" href="https://github.com/OverRevvv/vimvibe" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px">GitHub</a>
  <button class="icon" id="theme" aria-label="Toggle theme">◐</button>
</header>
<div class="layout">
  <nav id="pages"></nav>
  <main id="content"><p>Loading…</p></main>
  <aside id="toc"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
"use strict";

/** The pages of the site, in reading order: route name -> Markdown file in the repository, grouped for the sidebar. */
const PAGES = [
  { id: "overview", title: "Overview", file: "README.md", group: "Get started" },
  { id: "using", title: "Using vimvibe", file: "docs/using.md", group: "Guide" },
  { id: "configuration", title: "Configuration", file: "docs/configuration.md", group: "Guide" },
  { id: "architecture", title: "How it works", file: "docs/architecture.md", group: "Guide" },
  { id: "shortcat-parity", title: "Shortcat parity", file: "docs/shortcat-parity.md", group: "Reference" },
  { id: "limitations", title: "Known limitations", file: "docs/limitations.md", group: "Reference" },
  { id: "development", title: "Development", file: "docs/development.md", group: "Contribute" },
  { id: "contributing", title: "Contributing & DevOps", file: "CONTRIBUTING.md", group: "Contribute" },
  { id: "copy-plan", title: "Plan: copy text", file: "research/12-copy-paste-plan.md", group: "Contribute" },
];
const REPO = "https://github.com/OverRevvv/vimvibe";
const $ = (s) => document.querySelector(s);
/** Markdown text of every page already fetched, by page id (also what the search looks through). */
const cache = {};

/** Turn a heading's text into the id used for its anchor (same rule everywhere so links and the TOC agree). */
function slug(text) {
  return text.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
}

/** Fetch a page's Markdown once; resolves with the text. */
async function load(page) {
  if (cache[page.id] === undefined) {
    const r = await fetch(page.file);
    if (!r.ok) throw new Error(`${page.file}: ${r.status}`);
    cache[page.id] = await r.text();
  }
  return cache[page.id];
}

/** Map a link found in a Markdown file (written for GitHub) to where it should go on the site. */
function rewriteHref(href, fromFile) {
  if (/^(https?:|mailto:)/.test(href)) return { href, external: true };
  if (href.startsWith("#")) return { href: "#anchor:" + href.slice(1) };
  const [path, hash] = href.split("#");
  const base = fromFile.includes("/") ? fromFile.replace(/[^/]+$/, "") : "";
  const parts = (base + path).split("/");
  const out = [];
  for (const p of parts) { if (p === "..") out.pop(); else if (p && p !== ".") out.push(p); }
  const target = out.join("/");
  const page = PAGES.find((p) => p.file === target);
  if (page) return { href: "#/" + page.id + (hash ? "/" + hash : "") };
  // research notes, source files, images: they live in the repository
  return { href: `${REPO}/blob/main/${target}${hash ? "#" + hash : ""}`, external: true };
}

/** Render one page's Markdown into the content area: headings get ids and anchors, tables scroll, code blocks get copy buttons. */
function render(page, md) {
  const html = marked.parse(md, { gfm: true, breaks: false });
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("a[href]").forEach((a) => {
    const r = rewriteHref(a.getAttribute("href"), page.file);
    a.setAttribute("href", r.href);
    if (r.external) { a.target = "_blank"; a.rel = "noopener"; }
    if (r.href.startsWith("#anchor:")) a.dataset.anchor = r.href.slice(8);
  });
  box.querySelectorAll("img").forEach((img) => {
    // image paths are relative to the Markdown file; the site root is the repository root
    const src = img.getAttribute("src");
    if (!/^https?:/.test(src)) img.src = rewriteHrefPath(src, page.file);
    img.loading = "lazy";
  });
  const used = {};
  box.querySelectorAll("h1,h2,h3").forEach((h) => {
    let id = slug(h.textContent), n = used[id] = (used[id] || 0) + 1;
    if (n > 1) id += "-" + n;
    h.id = id;
    if (h.tagName !== "H1") h.insertAdjacentHTML("beforeend", `<a class="anchor" href="#anchor:${id}">#</a>`);
  });
  box.querySelectorAll("table").forEach((t) => {
    const w = document.createElement("div");
    w.className = "tablewrap";
    t.replaceWith(w);
    w.appendChild(t);
  });
  box.querySelectorAll("pre").forEach((pre) => {
    const b = document.createElement("button");
    b.className = "copy"; b.textContent = "Copy";
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.querySelector("code").innerText); b.textContent = "Copied"; } catch { b.textContent = "Press Ctrl+C"; }
      setTimeout(() => (b.textContent = "Copy"), 1200);
    };
    pre.appendChild(b);
  });
  return box;
}

/** Resolve an image path written relative to a Markdown file into a path from the site root. */
function rewriteHrefPath(path, fromFile) {
  const base = fromFile.includes("/") ? fromFile.replace(/[^/]+$/, "") : "";
  const out = [];
  for (const p of (base + path).split("/")) { if (p === "..") out.pop(); else if (p && p !== ".") out.push(p); }
  return out.join("/");
}

/** Build the right-hand "on this page" list from the rendered headings. */
function buildToc(box) {
  const toc = $("#toc");
  toc.innerHTML = "";
  box.querySelectorAll("h2,h3").forEach((h) => {
    const a = document.createElement("a");
    a.href = "#anchor:" + h.id;
    a.dataset.anchor = h.id;
    a.className = h.tagName.toLowerCase();
    a.textContent = h.firstChild.textContent;
    toc.appendChild(a);
  });
}

/** Highlight the TOC entry of the heading currently near the top of the viewport. */
function trackToc() {
  const heads = [...document.querySelectorAll("main h2, main h3")];
  let cur = null;
  for (const h of heads) if (h.getBoundingClientRect().top < 120) cur = h.id;
  document.querySelectorAll("#toc a").forEach((a) => a.classList.toggle("on", a.dataset.anchor === cur));
}

/** Scroll to a heading id inside the current page and keep the URL as #/page/anchor so it can be shared. */
function goAnchor(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const page = location.hash.replace(/^#\//, "").split("/")[0] || "overview";
  history.replaceState(null, "", `#/${page}/${id}`);
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

/** Show the page named by the URL hash (#/page or #/page/anchor); falls back to the overview. */
async function route() {
  const [id, anchor] = location.hash.replace(/^#\//, "").split("/");
  const page = PAGES.find((p) => p.id === id) || PAGES[0];
  document.querySelectorAll("nav#pages a").forEach((a) => a.classList.toggle("on", a.dataset.id === page.id));
  $("nav#pages").classList.remove("open");
  const main = $("#content");
  try {
    const md = await load(page);
    const box = render(page, md);
    main.replaceChildren(box);
    const i = PAGES.indexOf(page), prev = PAGES[i - 1], next = PAGES[i + 1];
    const pager = document.createElement("div");
    pager.className = "pager";
    pager.innerHTML = (prev ? `<a href="#/${prev.id}"><small>Previous</small>← ${prev.title}</a>` : "<span></span>") +
                      (next ? `<a class="next" href="#/${next.id}"><small>Next</small>${next.title} →</a>` : "<span></span>");
    main.appendChild(pager);
    const edit = document.createElement("p");
    edit.innerHTML = `<small><a href="${REPO}/edit/main/${page.file}" target="_blank" rel="noopener">Edit this page on GitHub</a></small>`;
    main.appendChild(edit);
    document.title = (page.id === "overview" ? "vimvibe" : page.title + " · vimvibe");
    buildToc(box);
    if (anchor) setTimeout(() => document.getElementById(anchor)?.scrollIntoView(), 30); else window.scrollTo(0, 0);
    trackToc();
  } catch (e) {
    main.innerHTML = `<h1>Could not load this page</h1><p>${e.message}. If you opened this file directly, serve the folder over HTTP (<code>python3 -m http.server</code>) or use GitHub Pages.</p>`;
  }
}

/** Build the sidebar grouped by section. */
function buildNav() {
  const nav = $("#pages");
  let group = "";
  for (const p of PAGES) {
    if (p.group !== group) { group = p.group; nav.insertAdjacentHTML("beforeend", `<h4>${group}</h4>`); }
    nav.insertAdjacentHTML("beforeend", `<a href="#/${p.id}" data-id="${p.id}">${p.title}</a>`);
  }
}

/** Search every page's text (loads them all on first use) and list matching sections with the matched text marked. */
async function search(q) {
  const main = $("#content");
  q = q.trim();
  if (q.length < 2) return route();
  await Promise.all(PAGES.map(load));
  const needle = q.toLowerCase();
  const hits = [];
  for (const p of PAGES) {
    let section = p.title;
    for (const line of cache[p.id].split("\n")) {
      const h = line.match(/^#{1,3}\s+(.*)/);
      if (h) section = h[1];
      if (line.toLowerCase().includes(needle)) hits.push({ p, section, line: line.replace(/[|*`#]/g, " ").replace(/\s+/g, " ").trim() });
    }
  }
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const mark = (s) => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/&/g, "&amp;"), "ig"), (m) => `<mark>${m}</mark>`);
  main.innerHTML = `<h1>Search: ${esc(q)}</h1><p>${hits.length} match${hits.length === 1 ? "" : "es"}</p><div id="results">` +
    hits.slice(0, 60).map((h) => `<div class="hit"><small>${h.p.title} · ${esc(h.section)}</small><br><a href="#/${h.p.id}/${slug(h.section)}">${mark(h.line.slice(0, 220))}</a></div>`).join("") + "</div>";
  $("#toc").innerHTML = "";
}

// wiring
buildNav();
window.addEventListener("hashchange", () => { if (!location.hash.startsWith("#anchor:")) route(); });
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='#anchor:']");
  if (a) { e.preventDefault(); goAnchor(a.getAttribute("href").slice(8)); }
});
window.addEventListener("scroll", trackToc, { passive: true });
$("#menu").onclick = () => $("nav#pages").classList.toggle("open");
let timer;
$("#search").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 180); });
$("#theme").onclick = () => {
  const dark = (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("vimvibe-theme", document.documentElement.dataset.theme); } catch {}
};
try { const t = localStorage.getItem("vimvibe-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
route();
</script>
</body>
</html>
