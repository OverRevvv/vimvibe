<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>vimvibe</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7fb"/>
    </linearGradient>
    <linearGradient id="vv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- soft light from the top left -->
    <ellipse cx="70" cy="30" rx="170" ry="90" fill="#ffffff" opacity="0.14"/>

    <!-- the keyboard: three faded rows of keys running off the bottom of the tile -->
    <g fill="#ffffff" opacity="0.30">
      <rect x="22"  y="150" width="34" height="30" rx="8"/>
      <rect x="62"  y="150" width="34" height="30" rx="8"/>
      <rect x="102" y="150" width="34" height="30" rx="8"/>
      <rect x="142" y="150" width="34" height="30" rx="8"/>
      <rect x="182" y="150" width="34" height="30" rx="8"/>
      <rect x="222" y="150" width="34" height="30" rx="8"/>
      <rect x="40"  y="186" width="34" height="30" rx="8"/>
      <rect x="80"  y="186" width="34" height="30" rx="8"/>
      <rect x="120" y="186" width="34" height="30" rx="8"/>
      <rect x="160" y="186" width="34" height="30" rx="8"/>
      <rect x="200" y="186" width="34" height="30" rx="8"/>
      <rect x="-2"  y="186" width="34" height="30" rx="8"/>
      <rect x="62"  y="222" width="132" height="30" rx="8"/>
      <rect x="22"  y="222" width="34" height="30" rx="8"/>
      <rect x="200" y="222" width="34" height="30" rx="8"/>
    </g>
  </g>

  <!-- the big key: shadow, side, top face -->
  <ellipse cx="128" cy="166" rx="66" ry="12" fill="#0b2a6b" opacity="0.45" filter="url(#soft)"/>
  <rect x="62" y="44" width="132" height="128" rx="30" fill="#9db8e6"/>
  <rect x="62" y="36" width="132" height="128" rx="30" fill="url(#face)"/>
  <rect x="62" y="36" width="132" height="128" rx="30" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

  <!-- the V -->
  <path d="M98 74 L128 130 L158 74" fill="none" stroke="#1e3a8a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.18" transform="translate(0 4)"/>
  <path d="M98 74 L128 130 L158 74" fill="none" stroke="url(#vv)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- a vimvibe label (flag) pinned to the key's corner -->
  <rect x="150" y="26" width="52" height="30" rx="9" fill="#facc15" stroke="#ffffff" stroke-width="3"/>
  <rect x="160" y="37" width="12" height="8" rx="3" fill="#78350f"/>
  <rect x="178" y="37" width="12" height="8" rx="3" fill="#78350f"/>
</svg>
